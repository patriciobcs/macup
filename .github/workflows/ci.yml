name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: Build app and unit tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)/Contents/Developer" && xcodebuild -version
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: Format check
        run: swift format lint --strict --recursive Macup/Sources MacupTests
      - name: SwiftLint
        run: swiftlint --strict --quiet
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild -project Macup.xcodeproj -scheme Macup -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= test 2>&1 | tee build.log | grep -E "error:|Test Case .* failed|Executed .* tests|TEST" || true
          grep -q "TEST SUCCEEDED" build.log
      - name: Render every view from fixtures
        # Draws the panel, window and Settings offscreen; a crash in any view fails here.
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData build -name MacUp.app -path '*Debug*' 2>/dev/null | head -n1)
          MACUP_SCREENSHOTS="$RUNNER_TEMP/shots" "$app/Contents/MacOS/MacUp"
          test "$(ls "$RUNNER_TEMP/shots"/*.png | wc -l)" -eq 6
      - name: Script syntax
        run: find Macup/Resources/Scripts tests -name '*.sh' -exec zsh -n {} \;

  scripts-macos:
    name: Package manager integrations (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install managers and pin old packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tests/macos/setup.sh
      - name: Scan, upgrade, remove, verify
        env:
          # Shared runners exhaust GitHub's anonymous API limit; tools like uv honour these.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UV_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tests/macos/run-tests.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-upgrade-logs
          path: /tmp/*-*.log
          if-no-files-found: ignore

  scripts-linux:
    name: Package manager integrations (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build bench image
        run: docker build -t macup-test -f tests/docker/Dockerfile .
      - name: Run
        run: docker run --rm macup-test
