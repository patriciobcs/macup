name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos_integration:
        description: Run real package upgrades and removals on a disposable macOS runner
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Standard GitHub-hosted runners, macOS included, are free on public repositories, so the app is built
# and tested here. Real macOS package upgrades run only on an explicitly requested disposable runner.
jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      app: ${{ steps.filter.outputs.app }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            scripts:
              - 'Macup/Resources/Scripts/**'
              - 'tests/docker/**'
              - '.github/workflows/ci.yml'
            app:
              - 'Macup/**'
              - 'MacupTests/**'
              - 'tests/scan/**'
              - 'tests/upgrade/**'
              - 'project.yml'
              - 'scripts/**'
              - '.swift-format'
              - '.swiftlint.yml'
              - '.github/workflows/ci.yml'
            site:
              - 'site/**'
              - '.github/workflows/ci.yml'

  scripts-linux:
    name: Package manager integrations (Linux)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Script syntax
        run: |
          sudo apt-get install -y -qq zsh >/dev/null
          find Macup/Resources/Scripts tests -name '*.sh' -exec zsh -n {} \;
      - name: Build bench image
        run: docker build -t macup-test -f tests/docker/Dockerfile .
      - name: Run
        run: docker run --rm macup-test

  app:
    name: Build and test (macOS)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The same checks as a contributor runs: format, lint, script syntax, the scan tests, the unit
      # tests, a render of every view, and coverage. scripts/check.sh is the one definition of them.
      - name: Install the tools the checks need
        run: brew install --quiet xcodegen swiftlint codecov-cli
      - name: Check, test and measure coverage
        env:
          # Absent on forks, where check.sh measures coverage without uploading it.
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: scripts/check.sh
      # always(), not failure(): a job killed by the timeout counts as cancelled, and that is exactly
      # the case where the log is the only way to find out what hung.
      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-log
          path: |
            build/check.log
            build/build.log
          if-no-files-found: ignore

  site:
    name: Website checks and build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Check and build
        working-directory: site
        run: npm ci && npm run check && npm run build

  macos-integration:
    name: Real package upgrades (macOS)
    if: github.event_name == 'workflow_dispatch' && inputs.macos_integration
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Prepare disposable runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tests/macos/setup.sh
      - name: Scan, upgrade, remove and rescan
        run: tests/macos/run-tests.sh
