name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Standard GitHub-hosted runners, macOS included, are free on public repositories, so the app is built
# and tested here. The macOS package-manager integration in tests/macos still runs by hand: it installs
# every manager and changes real packages.
jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            scripts:
              - 'Macup/Resources/Scripts/**'
              - 'tests/docker/**'
              - '.github/workflows/ci.yml'
            app:
              - 'Macup/**'
              - 'MacupTests/**'
              - 'tests/scan/**'
              - 'tests/upgrade/**'
              - 'project.yml'
              - 'scripts/**'
              - '.swift-format'
              - '.swiftlint.yml'
              - '.github/workflows/ci.yml'

  scripts-linux:
    name: Package manager integrations (Linux)
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Script syntax
        run: |
          sudo apt-get install -y -qq zsh >/dev/null
          find Macup/Resources/Scripts tests -name '*.sh' -exec zsh -n {} \;
      - name: Build bench image
        run: docker build -t macup-test -f tests/docker/Dockerfile .
      - name: Run
        run: docker run --rm macup-test

  app:
    name: Build and test (macOS)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The same checks as a contributor runs: format, lint, script syntax, the scan tests, the unit
      # tests, a render of every view, and coverage. scripts/check.sh is the one definition of them.
      - name: Install the tools the checks need
        run: brew install --quiet xcodegen swiftlint codecov-cli
      - name: Check, test and measure coverage
        env:
          # Absent on forks, where check.sh measures coverage without uploading it.
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: scripts/check.sh
      # always(), not failure(): a job killed by the timeout counts as cancelled, and that is exactly
      # the case where the log is the only way to find out what hung.
      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-log
          path: |
            build/check.log
            build/build.log
          if-no-files-found: ignore
