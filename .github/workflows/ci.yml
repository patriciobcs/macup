name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# macOS runners are not used: their minutes bill at ten times the rate. The app build, unit tests, view
# render and macOS package-manager integration run locally through scripts/check.sh (see README).
jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            scripts:
              - 'Macup/Resources/Scripts/**'
              - 'tests/docker/**'
              - '.github/workflows/ci.yml'

  scripts-linux:
    name: Package manager integrations (Linux)
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Script syntax
        run: |
          sudo apt-get install -y -qq zsh >/dev/null
          find Macup/Resources/Scripts tests -name '*.sh' -exec zsh -n {} \;
      - name: Build bench image
        run: docker build -t macup-test -f tests/docker/Dockerfile .
      - name: Run
        run: docker run --rm macup-test
