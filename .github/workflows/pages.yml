name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # GitHub Pages needs a public repo on the free plan; the build still runs privately as a check.
      - uses: actions/configure-pages@v5
        if: ${{ !github.event.repository.private }}
      - name: Build static site
        working-directory: site
        env:
          # Served from https://<owner>.github.io/<repo>/ unless a custom domain is configured.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm ci && npm run check && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
