version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    groups:
      site: { patterns: ["*"] }
    ignore:
      # eslint-config-next does not support ESLint 10 yet; take the major when Next does.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # typescript-eslint (via eslint-config-next) does not run on TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
