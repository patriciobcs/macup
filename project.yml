name: Macup
options:
  bundleIdPrefix: io.github.patriciobcs
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.0"
targets:
  Macup:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Macup/Sources
      - path: Macup/Resources/Scripts
        type: folder
        buildPhase: resources
      - path: Macup/Resources/AppIcons
        type: folder
        buildPhase: resources
      - path: Macup/Resources/MacUp.icon
        type: file
        buildPhase: resources
    info:
      path: Macup/Info.plist
      properties:
        CFBundleName: MacUp
        CFBundleDisplayName: MacUp
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Sparkle: the appcast lives on the latest GitHub release; the public key verifies signed updates.
        SUFeedURL: https://github.com/patriciobcs/macup/releases/latest/download/appcast.xml
        SUPublicEDKey: wD1ZrmMo9t3hkK/5/EFUuE/NIascTG66Kj7IN7s1i9A=
        SUEnableAutomaticChecks: true
    entitlements:
      path: Macup/Macup.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.patriciobcs.macup
        PRODUCT_NAME: MacUp
        ASSETCATALOG_COMPILER_APPICON_NAME: MacUp
        PRODUCT_MODULE_NAME: Macup
        INFOPLIST_KEY_LSUIElement: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: minimal
  MacupTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MacupTests]
    dependencies:
      - target: Macup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.patriciobcs.macup.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MacUp.app/Contents/MacOS/MacUp
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Macup:
    build:
      targets:
        Macup: all
        MacupTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [MacupTests]
      gatherCoverageData: true
      coverageTargets: [Macup]
